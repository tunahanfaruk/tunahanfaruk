<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-label="How Xorviex is kept safe to give real access">
<title>How Xorviex is kept safe to give real access</title>
<defs>
<clipPath id="cl0"><rect x="0" y="4" width="880" height="52" rx="12" ry="12"/></clipPath>
<clipPath id="cl1"><rect x="0" y="66" width="880" height="68" rx="12" ry="12"/></clipPath>
<clipPath id="cl2"><rect x="0" y="144" width="880" height="68" rx="12" ry="12"/></clipPath>
<clipPath id="cl3"><rect x="0" y="222" width="880" height="52" rx="12" ry="12"/></clipPath>
<clipPath id="cl4"><rect x="0" y="284" width="880" height="68" rx="12" ry="12"/></clipPath>
</defs>
<rect x="0" y="4" width="880" height="52" rx="12" ry="12" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<g clip-path="url(#cl0)"><rect x="0" y="4" width="4.5" height="52" fill="#4493f8"/></g>
<text x="22" y="34.5" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">Independent review</text>
<text x="272" y="33.5" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">The agent that does the work is never the one that approves it.</text>
<rect x="0" y="66" width="880" height="68" rx="12" ry="12" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<g clip-path="url(#cl1)"><rect x="0" y="66" width="4.5" height="68" fill="#4493f8"/></g>
<text x="22" y="104.5" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">Least access by default</text>
<text x="272" y="94.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">An agent can only reach the integrations you connected, only in the workspace</text>
<text x="272" y="113.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">it&#x27;s running in.</text>
<rect x="0" y="144" width="880" height="68" rx="12" ry="12" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<g clip-path="url(#cl2)"><rect x="0" y="144" width="4.5" height="68" fill="#4493f8"/></g>
<text x="22" y="182.5" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">Your accounts stay yours</text>
<text x="272" y="172.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">Every connected credential is encrypted. Code changes arrive as a pull request</text>
<text x="272" y="191.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">to review — never a direct push.</text>
<rect x="0" y="222" width="880" height="52" rx="12" ry="12" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<g clip-path="url(#cl3)"><rect x="0" y="222" width="4.5" height="52" fill="#4493f8"/></g>
<text x="22" y="252.5" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">Two-factor on by default</text>
<text x="272" y="251.5" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">With recovery codes. Not an opt-in buried in a settings menu.</text>
<rect x="0" y="284" width="880" height="68" rx="12" ry="12" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<g clip-path="url(#cl4)"><rect x="0" y="284" width="4.5" height="68" fill="#4493f8"/></g>
<text x="22" y="322.5" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">Honest numbers</text>
<text x="272" y="312.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">A figure with nothing to compare against is reported as “not enough history”,</text>
<text x="272" y="331.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">never rounded up into a story.</text>
</svg>
