<svg xmlns="http://www.w3.org/2000/svg" width="880" height="344" viewBox="0 0 880 344" role="img" aria-label="Xorviex compared with other agent products">
<title>Xorviex compared with other agent products</title>
<text x="214.0" y="26" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#818b98" letter-spacing="1.2">EVERY OTHER AGENT PRODUCT</text>
<text x="666.0" y="26" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0969da" letter-spacing="1.2">XORVIEX</text>
<rect x="0" y="46" width="428" height="94" rx="12" ry="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="20" y="88.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#9198a1">✕</text>
<text x="46" y="88.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#59636e">A fixed org chart — a researcher, a writer, a</text>
<text x="46" y="108.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#59636e">reviewer, forever.</text>
<rect x="452" y="46" width="428" height="94" rx="12" ry="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="472" y="78.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1a7f37">✓</text>
<text x="498" y="78.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1f2328">The team is designed per mission. How many</text>
<text x="498" y="98.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1f2328">agents, and what each one owns, comes out of the</text>
<text x="498" y="118.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1f2328">goal you wrote.</text>
<rect x="0" y="154" width="428" height="94" rx="12" ry="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="20" y="206.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#9198a1">✕</text>
<text x="46" y="206.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#59636e">Reads and summarises. You still do the work.</text>
<rect x="452" y="154" width="428" height="94" rx="12" ry="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="472" y="186.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1a7f37">✓</text>
<text x="498" y="186.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1f2328">Searches the live web, opens pages, pulls real</text>
<text x="498" y="206.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1f2328">numbers — then sends the message, opens the PR,</text>
<text x="498" y="226.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1f2328">publishes the post.</text>
<rect x="0" y="262" width="428" height="74" rx="12" ry="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="20" y="304.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#9198a1">✕</text>
<text x="46" y="304.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#59636e">Whatever the model says is what you get.</text>
<rect x="452" y="262" width="428" height="74" rx="12" ry="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="472" y="294.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1a7f37">✓</text>
<text x="498" y="294.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1f2328">A separate AI reviews every output before it goes</text>
<text x="498" y="314.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1f2328">anywhere. Weak work is sent back and redone.</text>
</svg>
